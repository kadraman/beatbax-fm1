name: Bug
description: Something is not working as expected
title: "[Bug]: "
labels:
  - bug

body:
  - type: markdown
    attributes:
      value: |
        Please fill out the following to help us fix the issue faster. If this bug implies a behavior change, the fix PR must update the linked spec (or add a spec folder).

  - type: input
    id: version
    attributes:
      label: Affected version
      placeholder: "v0.1.0 or commit SHA"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Describe the bug clearly and concisely.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
        3. …
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true

  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Critical (crash / data loss / brick risk)
        - High
        - Medium
        - Low
    validations:
      required: true

  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - FM-1 hardware
        - Host (Windows)
        - Host (macOS)
        - Host (Linux)
        - Emulator
        - Other

  - type: input
    id: related_spec
    attributes:
      label: Related specification
      description: Optional. Path or URL to `specs/.../spec.md`.
      placeholder: specs/features/001-platform-bring-up/spec.md

  - type: textarea
    id: hardware
    attributes:
      label: Hardware notes
      description: Firmware version on device, stock vs custom previously installed, recovery steps tried.
